name: Serpent de contributions

on:
  schedule:
    - cron: "17 */12 * * *"   # deux fois par jour
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Générer le serpent (palette bleu + jaune acide)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0b5cff&color_dots=#d6e4ff,#9ec1ff,#5c97ff,#2f6fff,#0b45c7
            dist/snake-dark.svg?palette=github-dark&color_snake=#fcee0a&color_dots=#0e1a36,#12408f,#1f7bff,#00d0ff,#bfe3ff

      - name: Publier sur la branche « output »
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
